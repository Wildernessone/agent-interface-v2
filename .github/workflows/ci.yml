name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+ — the smoke harness SSR-loads the Supabase client, which
          # needs a native global WebSocket (added in Node 22). Also keeps CI
          # aligned with the local dev runtime.
          node-version: 22
          cache: npm
      - run: npm ci
      # .env is gitignored; build + smoke only need import.meta.env to resolve
      # (Supabase throws on a missing URL at import). Dummy values are fine —
      # the smoke harness mocks all network calls.
      - name: Write dummy env
        run: |
          cat > .env <<'ENV'
          VITE_SUPABASE_URL=https://example.supabase.co
          VITE_SUPABASE_ANON_KEY=dummy-anon-key
          VITE_PROXY_URL=https://claude-proxy.example.workers.dev
          VITE_DROPBOX_CLIENT_ID=dummy
          ENV
      # Gating steps — must pass before code reaches users.
      - name: Build
        run: npm run build
      # The FULL deterministic smoke suite (all network mocked). Was only
      # running smoke.mjs — every other smoke (panel-first, tiers, entitlements,
      # brand-gate, suggested-prompts, …) was written but never gated. smoke:all
      # runs them all; smoke:live stays manual (real paid APIs).
      - name: Smoke tests (all)
        run: npm run smoke:all
      # Public E2E — the unauthenticated Playwright smoke (landing renders,
      # pricing, /login, no console errors on first paint). Boots Vite itself via
      # playwright.config webServer. Authed flows need a test account + BYOK keys
      # (TEST_EMAIL/TEST_PASSWORD) and run separately, not in the push gate.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Public E2E
        run: npm run e2e:public
      # Informational — repo carries pre-existing lint debt. Doesn't block the
      # gate; tighten to a hard failure once the debt is cleared.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
