name: Council author (daily)

# ⛔ THE DAILY SCHEDULE IS OFF. Commented out 2026-08-22 — do not uncomment.
#
# This ran the 3-stage AI Council on a fresh topic and inserted a generated DRAFT into
# council_pages, every day at 18:00 UTC, on main. It fired successfully on a daily
# cadence through 2026-07-13, then someone switched the workflow off in the GitHub UI
# (API reports state=disabled_manually). That left the repo and the running system
# disagreeing: GitHub said OFF, this file still said "daily", and a repo file is what
# the next session reads. Re-enabling the workflow in the UI — or a fork, or a restored
# repo — would have resumed daily generation with nothing in the code to say not to.
#
# It is off for two reasons, both standing:
#   1. Every content engine in this portfolio is deliberately paused. This one is a
#      GitHub Actions cron rather than a cloud routine, so the "all engines are off"
#      check (RemoteTrigger list) never saw it.
#   2. Its 26 outputs were withdrawn from Google on 2026-08-22 — they now serve
#      noindex,follow, and were pulled from sitemap-council.xml, robots.txt and
#      /feed.xml. Generating a 27th daily, on James's paid provider keys, would be
#      spending real money to grow the exact liability that change was cleaning up.
#      (See functions/council/[slug].js for the full reasoning.)
#
# workflow_dispatch is intentionally KEPT, so the flow stays runnable by hand if the
# Council is ever revived deliberately. Reviving it means re-enabling the workflow in
# the GitHub UI as well — this file alone does not turn it back on.
# See docs/content-engine/council-content-engine.md.

on:
  # schedule:
  #   - cron: '0 18 * * *' # 18:00 UTC = 11:00 AM PT — daily while the library is small
  workflow_dispatch:
    inputs:
      count:
        description: 'How many fresh topics to draft this run'
        required: false
        default: '1'
      topic:
        description: 'Ad-hoc question (overrides the topics file; optional)'
        required: false
        default: ''
      dry_run:
        description: 'Run the council but do NOT insert (true/false)'
        required: false
        default: 'false'

# One run at a time — never let two authors race the same topic.
concurrency:
  group: council-author
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Convene the council → draft
        run: |
          ARGS="--count=${{ github.event.inputs.count || '1' }}"
          if [ -n "${{ github.event.inputs.topic }}" ]; then ARGS="--topic=${{ github.event.inputs.topic }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "Running: node scripts/council-author.mjs $ARGS"
          node scripts/council-author.mjs $ARGS
        env:
          COUNCIL_SUPABASE_SERVICE_KEY: ${{ secrets.COUNCIL_SUPABASE_SERVICE_KEY }}
          # Reuses the repo's existing provider-key secret names (see smoke-live.yml).
          # A member is skipped if its key is absent; needs ≥2 to convene.
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
